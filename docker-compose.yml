services:
  credito: # <--- ESTE NOME TEM DE SER IGUAL AO DB_HOST DO .ENV!
    image: postgres:16-alpine
    container_name: meu_postgres
    env_file:
      - ./backend/.env
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api_backend:
    build: ./backend
    container_name: meu_backend
    restart: on-failure
    ports:
      - "5000:5000"
    # Adiciona esta linha abaixo para o Docker injetar o teu .env no container!
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/upload:/app/upload
      - ./backend/upload/comprovativos:/app/upload/comprovativos
    depends_on:
      credito:
        condition: service_healthy

  # Interface visual para a base de dados (Postgres). Acede em
  # http://localhost:8080 — servidor "credito", utilizador/password/BD
  # vêm do teu backend/.env (DB_USER/DB_PASS/DB_NAME).
  adminer:
    image: adminer:4
    container_name: meu_adminer
    restart: on-failure
    environment:
      ADMINER_DEFAULT_SERVER: credito
    ports:
      - "8080:8080"
    depends_on:
      credito:
        condition: service_healthy

  # 3. FRONTEND (React + Vite)
  web_frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # <-- Repare no espaço obrigatório depois do hífen
    depends_on:
      - api_backend

volumes:
  dados_postgres: # Garante que os dados do banco não sumam quando o container para