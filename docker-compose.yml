services:
  credito: # <--- ESTE NOME TEM DE SER IGUAL AO DB_HOST DO .ENV!
    image: postgres:16-alpine
    container_name: meu_postgres
    env_file:
      - ./backend/.env
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Só localhost: acesso de fora só via túnel SSH (ssh -L 5432:localhost:5432 ...),
      # nunca exposto diretamente à internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Limite de memória, ver nota geral sobre mem_limit no fim do ficheiro.
    mem_limit: 512m
    mem_reservation: 256m

  api_backend:
    build: ./backend
    container_name: meu_backend
    restart: on-failure
    ports:
      # Só localhost: em produção o tráfego externo entra pelo Caddy
      # partilhado da VPS (fora deste repo, ver RECUPERACAO_BD.md), que
      # fala com este serviço pela rede Docker externa "web" (nome do
      # container: meu_backend), não precisa de porta pública aqui.
      - "127.0.0.1:5000:5000"
    # Adiciona esta linha abaixo para o Docker injetar o teu .env no container!
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/upload:/app/upload
      - ./backend/upload/comprovativos:/app/upload/comprovativos
    depends_on:
      credito:
        condition: service_healthy
    networks:
      - default
      - web
    mem_limit: 512m
    mem_reservation: 256m

  # Interface visual para a base de dados (Postgres). Acede em
  # http://localhost:8080, servidor "credito", utilizador/password/BD
  # vêm do teu backend/.env (DB_USER/DB_PASS/DB_NAME).
  adminer:
    image: adminer:4
    container_name: meu_adminer
    restart: on-failure
    environment:
      ADMINER_DEFAULT_SERVER: credito
    ports:
      # Só localhost: acesso de fora só via túnel SSH, nunca exposto
      # diretamente à internet (é uma interface de admin sem MFA).
      - "127.0.0.1:8080:8080"
    depends_on:
      credito:
        condition: service_healthy
    mem_limit: 128m

  # 3. FRONTEND (React + Vite)
  # Build multi-stage (ver frontend/Dockerfile): compila para dist/ e serve
  # com Nginx puro, sem Vite dev server em produção, sem bind mount do
  # código fonte (isso é só útil com HMR, que já não existe aqui).
  web_frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: frontend
    restart: on-failure
    ports:
      # Só localhost: em produção o Caddy partilhado da VPS é que fala com
      # este serviço pela rede Docker externa "web" (nome do container:
      # frontend). Em dev local sem esse Caddy, continua acessível em
      # http://localhost:8081.
      - "127.0.0.1:8081:80"
    depends_on:
      - api_backend
    networks:
      - default
      - web
    mem_limit: 128m

volumes:
  dados_postgres: # Garante que os dados do banco não sumam quando o container para

# Rede externa do Caddy partilhado da VPS (já existe fora deste projeto,
# um único Caddy serve vários projetos/domínios na mesma máquina). Ligamos
# api_backend e web_frontend a ela para o Caddy conseguir fazer
# reverse_proxy para "meu_backend:5000" e "frontend:80". Ver
# RECUPERACAO_BD.md para o bloco de configuração adicionado ao Caddyfile
# partilhado (fora deste repo, em /opt/vektra-site/Caddyfile na VPS).
networks:
  default:
  web:
    external: true

# Nota sobre mem_limit: isto usa `docker compose up` "standalone" (não Swarm),
# por isso o limite tem de ser `mem_limit`/`mem_reservation` no nível do
# serviço, o bloco `deploy.resources.limits` do Compose Spec só é respeitado
# em modo Swarm (`docker stack deploy`), `docker compose up` ignora-o
# silenciosamente. Os valores acima (512m para Postgres e para o backend
# Node, 128m para Nginx/Adminer) são pontos de partida conservadores para uma
# única VM pequena, ajustar conforme a RAM real da máquina de produção
# quando essa decisão for tomada. Sem limite nenhum (estado anterior), um
# único container com fuga de memória ou pico de tráfego podia consumir toda
# a RAM da máquina e derrubar os outros serviços, incluindo a própria BD.