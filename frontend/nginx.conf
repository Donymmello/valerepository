# Configuração Nginx para servir a SPA (React/Vite) já compilada.
# Ver frontend/Dockerfile, este ficheiro é copiado para dentro da imagem.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # JS/CSS/fontes: saída do build do Vite (pasta /assets), sempre com hash
    # no nome, o próprio nome muda quando o conteúdo muda, cache agressivo
    # e permanente é seguro.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e ícones: incluem ficheiros de frontend/public/ (favicon.svg,
    # og-image.png, icons.svg) que NUNCA mudam de nome mesmo quando o
    # conteúdo muda. Foi por causa do "immutable" aqui que, ao trocar o
    # favicon.svg (do ícone genérico do template Vite para o logo real da
    # Tshemba), quem já tinha visitado o site antes continuou a ver o
    # favicon antigo durante um ano, sem forma de o servidor corrigir isso.
    # Cache curto em vez disso: continua a poupar pedidos repetidos, sem
    # prender atualizações futuras.
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # index.html não pode ser cacheado da mesma forma, é ele que aponta para
    # os ficheiros com hash acima, e muda a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota que não seja um ficheiro real cai no index.html
    # (o React Router é que decide o que mostrar do lado do cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
