# Configuração Nginx para servir a SPA (React/Vite) já compilada.
# Ver frontend/Dockerfile, este ficheiro é copiado para dentro da imagem.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx no header Server.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Caminhos que uma SPA nunca serve: devolver 404 em vez do index.html.
    #
    # O try_files no fim deste ficheiro manda qualquer caminho desconhecido
    # para o index.html, que é o que faz o React Router funcionar. O efeito
    # colateral é que /.env, /backup.sql e /wp-config.php respondiam 200
    # com 2729 bytes de HTML — e para um scanner automático um 200 parece
    # um acerto. O log deste container está cheio dessas tentativas.
    #
    # Não há aqui ganho de segurança: os ficheiros não existem e nunca
    # foram servidos. O ganho é sair das listas de alvos: um 404 arruma a
    # sondagem, um 200 convida à seguinte.
    #
    # A ordem importa pouco entre blocos regex sem sobreposição, mas estes
    # vêm antes dos de assets por clareza de leitura.

    # Ficheiros e pastas ocultos: .env, .git, .aws, .bash_history...
    # O .well-known fica de fora por ser legítimo (ACME, security.txt).
    location ~ /\.(?!well-known) {
        return 404;
        include /etc/nginx/security-headers.conf;
    }

    # Extensões que este frontend nunca produz. Nada de .json aqui: um
    # manifest ou um ficheiro de configuração do próprio site podem vir a
    # existir, e os nomes perigosos estão cobertos no bloco seguinte.
    location ~* \.(?:php|phtml|sql|sqlite|db|key|pem|crt|p12|ini|log|bak|old|swp|sh|bash|zip|tar|gz|yml|yaml)$ {
        return 404;
        include /etc/nginx/security-headers.conf;
    }

    # Nomes concretos que os scanners pedem, e caminhos de CMS que este
    # site não é.
    location ~* ^/(?:wp-admin|wp-includes|wp-content|wp-login|xmlrpc|vendor|phpmyadmin|administrator|cgi-bin)(?:/|$) {
        return 404;
        include /etc/nginx/security-headers.conf;
    }

    location ~* ^/(?:secrets|settings|credentials|composer|package|package-lock)\.json$ {
        return 404;
        include /etc/nginx/security-headers.conf;
    }

    # ------------------------------------------------------------------

    # JS/CSS/fontes: saída do build do Vite (pasta /assets), sempre com hash
    # no nome, o próprio nome muda quando o conteúdo muda, cache agressivo
    # e permanente é seguro.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Imagens e ícones: incluem ficheiros de frontend/public/ (favicon.svg,
    # og-image.png, icons.svg) que NUNCA mudam de nome mesmo quando o
    # conteúdo muda. Foi por causa do "immutable" aqui que, ao trocar o
    # favicon.svg (do ícone genérico do template Vite para o logo real da
    # Tshemba), quem já tinha visitado o site antes continuou a ver o
    # favicon antigo durante um ano, sem forma de o servidor corrigir isso.
    # Cache curto em vez disso: continua a poupar pedidos repetidos, sem
    # prender atualizações futuras.
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # index.html não pode ser cacheado da mesma forma, é ele que aponta para
    # os ficheiros com hash acima, e muda a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # SPA: qualquer rota que não seja um ficheiro real cai no index.html
    # (o React Router é que decide o que mostrar do lado do cliente).
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
