# Configuração Nginx para servir a SPA (React/Vite) já compilada.
# Ver frontend/Dockerfile, este ficheiro é copiado para dentro da imagem.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ficheiros com hash no nome (o build do Vite já faz isto para JS/CSS) podem
    # ser cacheados de forma agressiva, o próprio nome do ficheiro muda quando
    # o conteúdo muda.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html não pode ser cacheado da mesma forma, é ele que aponta para
    # os ficheiros com hash acima, e muda a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota que não seja um ficheiro real cai no index.html
    # (o React Router é que decide o que mostrar do lado do cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
