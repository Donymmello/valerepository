# Headers de segurança da SPA.
#
# Ficheiro à parte por causa de uma regra do nginx que morde: um bloco
# `location` que declare QUALQUER add_header deixa de herdar os add_header
# do `server`. Como há locations com Cache-Control, os headers de segurança
# desapareceriam justamente nos ficheiros estáticos. Por isso isto é um
# include, repetido em cada bloco, em vez de ficar só no server.
#
# Vive em /etc/nginx/ e não em /etc/nginx/conf.d/, porque tudo o que está
# em conf.d/*.conf é carregado automaticamente como configuração própria.
#
# O helmet já põe o equivalente disto nas respostas do Express, mas o
# helmet só cobre /api/*. O HTML e o JavaScript da aplicação são servidos
# por este nginx e vinham sem header nenhum.

# Não ser metido dentro de um iframe. Num backoffice onde se aprovam
# créditos, clickjacking é risco concreto: um botão invisível de "Aprovar"
# por cima de outra coisa qualquer. Nada nesta aplicação se embebe a si
# própria; se um dia precisares, troca por SAMEORIGIN aqui e em
# frame-ancestors na CSP abaixo.
add_header X-Frame-Options "DENY" always;

# Respeitar o Content-Type declarado em vez de adivinhar pelo conteúdo.
add_header X-Content-Type-Options "nosniff" always;

# Não vazar o URL de origem para terceiros. Mesmo valor que o helmet usa
# no /api.
add_header Referrer-Policy "no-referrer" always;

# HTTPS obrigatório durante um ano. O /api já enviava isto, portanto o
# browser já o aplicava a este host depois da primeira chamada à API — mas
# a primeira coisa que se abre é o HTML, não a API.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Desligar APIs do browser que esta aplicação não usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy.
#
# style-src precisa de 'unsafe-inline': o MUI (emotion) injeta estilos
# inline em tempo de execução, e sem isto a aplicação renderiza sem
# formatação nenhuma. Não é descuido, é o preço da biblioteca.
#
# Já não há exceção para o Google: a Inter passou a ser servida do próprio
# domínio (ver public/fonts/ e o @font-face no index.html). Tudo o que esta
# página carrega vem agora de 'self', sem um único terceiro.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
