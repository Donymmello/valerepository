<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2 de proposito: o favicon.svg foi em tempos o logo do Vite e o
         nginx servia-o com Cache-Control immutable de 1 ano, portanto quem
         visitou o site antes da troca tem o icone errado preso no browser
         ate 2027. Mudar o URL cria uma entrada de cache nova e contorna
         isso. Ver frontend/nginx.conf, que ja nao usa immutable aqui. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tshemba: plataforma de gestão de crédito para financeiras e microcrédito. Pedidos, aprovação por níveis, desembolso, cobrança e relatórios, tudo num só sistema."
    />
    <link rel="canonical" href="https://tshemba.vektramz.com/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tshemba" />
    <meta property="og:locale" content="pt_MZ" />
    <meta property="og:url" content="https://tshemba.vektramz.com/" />
    <meta property="og:title" content="Tshemba: gestão de crédito para financeiras e microcrédito" />
    <meta
      property="og:description"
      content="Pedidos, aprovação por níveis, desembolso, cobrança e relatórios, tudo num só sistema."
    />
    <meta property="og:image" content="https://tshemba.vektramz.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tshemba: gestão de crédito para financeiras e microcrédito" />
    <meta
      name="twitter:description"
      content="Pedidos, aprovação por níveis, desembolso, cobrança e relatórios, tudo num só sistema."
    />
    <meta name="twitter:image" content="https://tshemba.vektramz.com/og-image.png" />

    <meta name="theme-color" content="#1a237e" />

    <!-- theme.js assume "Inter" como primeira fonte, sem isto, cai sempre
         no fallback (Roboto/sistema) porque a fonte nunca era carregada.

         Servida do proprio dominio, nao do Google. Antes vinha de
         fonts.googleapis.com, o que expunha o IP de cada visitante ao
         Google antes de qualquer consentimento — foi a base de processos
         na Europa, e obrigava a declarar o Google como terceiro na
         politica de privacidade. Agora o terceiro deixa de existir.

         Fonte variavel: um ficheiro cobre os pesos 400 a 800, em vez de
         cinco ficheiros. Inter e licenciada SIL OFL 1.1, que permite
         redistribuicao. O preload e so do subconjunto latin, que e o que
         a esmagadora maioria das paginas usa; o latin-ext carrega por
         necessidade. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/inter-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>Tshemba</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
