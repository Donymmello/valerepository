[pytest]
# -m "not contrato": os testes gerados a partir do contrato ESCREVEM na
# API e ficam desligados por omissao. Corre-os de proposito, contra um
# ambiente descartavel: pytest -m contrato
addopts = -v --strict-markers -m "not contrato"
markers =
    contrato: testes gerados do openapi.yaml pelo schemathesis; escrevem na API
